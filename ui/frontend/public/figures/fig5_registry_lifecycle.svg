<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5}
    .db{fill:#eef2ff;stroke:#4338ca;stroke-width:2}
    .hot{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
    .t{font-size:14px;font-weight:bold;fill:#0f172a}
    .s{font-size:12px;fill:#475569}
    .arrow{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
  </style>

  <rect x="30" y="40" width="180" height="80" class="box" rx="8"/>
  <text x="120" y="70" text-anchor="middle" class="t">1 · Tune</text>
  <text x="120" y="92" text-anchor="middle" class="s">Optuna HPO · periodic</text>

  <rect x="270" y="40" width="180" height="80" class="box" rx="8"/>
  <text x="360" y="70" text-anchor="middle" class="t">2 · Evaluate OOS</text>
  <text x="360" y="92" text-anchor="middle" class="s">test tail · scored once</text>

  <rect x="510" y="40" width="180" height="80" class="db" rx="8"/>
  <text x="600" y="70" text-anchor="middle" class="t">3 · Register</text>
  <text x="600" y="92" text-anchor="middle" class="s">weights + metrics</text>

  <rect x="30" y="200" width="270" height="90" class="box" rx="8"/>
  <text x="165" y="230" text-anchor="middle" class="t">4 · Select</text>
  <text x="165" y="252" text-anchor="middle" class="s">auto-best · one active</text>
  <text x="165" y="271" text-anchor="middle" class="s">manual override is sticky</text>

  <rect x="360" y="200" width="270" height="90" class="hot" rx="8"/>
  <text x="495" y="230" text-anchor="middle" class="t">5 · Serve nightly</text>
  <text x="495" y="252" text-anchor="middle" class="s">load active · predict next day</text>
  <text x="495" y="271" text-anchor="middle" class="s">settle vs realized close</text>

  <rect x="690" y="200" width="220" height="90" class="box" rx="8"/>
  <text x="800" y="230" text-anchor="middle" class="t">Fallback</text>
  <text x="800" y="252" text-anchor="middle" class="s">pinned XGBoost</text>
  <text x="800" y="271" text-anchor="middle" class="s">on any registry failure</text>

  <path class="arrow" d="M210 80 L268 80"/>
  <path class="arrow" d="M450 80 L508 80"/>
  <path class="arrow" d="M600 120 C600 165 350 170 230 198"/>
  <path class="arrow" d="M300 245 L358 245"/>
  <path class="arrow" d="M630 245 L688 245" stroke-dasharray="5 4"/>
</svg>
