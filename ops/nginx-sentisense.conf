# Deployed at /etc/nginx/conf.d/sentisense.conf on the front machine (ST26-703).
# TLS terminates here (college wildcard *.cs.colman.ac.il at /etc/ssl/cs/),
# proxying to the pm2-managed UI on 127.0.0.1:3000 (HTTP + WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name sentisens.cs.colman.ac.il;

    ssl_certificate     /etc/ssl/cs/CSB.crt;
    ssl_certificate_key /etc/ssl/cs/myserver.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sentisens.cs.colman.ac.il;
    return 301 https://$host$request_uri;
}
