<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>
  <style>
    .t{font-size:15px;font-weight:bold;fill:#0f172a}
    .s{font-size:11.5px;fill:#475569}
    .e{font-size:11px;fill:#4338ca}
  </style>
  <text x="490" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Leakage-safe chronological split — 70 / 15 / 15, transforms fit on train only</text>

  <!-- timeline bar -->
  <rect x="60"  y="90" width="560" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="620" y="90" width="120" height="70" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <rect x="740" y="90" width="120" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="860" y="90" width="60"  height="70" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="340" y="118" text-anchor="middle" class="t">TRAIN — 70%</text>
  <text x="340" y="138" text-anchor="middle" class="s">StandardScaler, PCA, KMeans, narrative</text>
  <text x="340" y="152" text-anchor="middle" class="s">clustering all FIT here, applied everywhere</text>

  <text x="680" y="118" text-anchor="middle" class="t">VALID — 15%</text>
  <text x="680" y="138" text-anchor="middle" class="s">every Optuna trial</text>
  <text x="680" y="152" text-anchor="middle" class="s">+ threshold choice</text>

  <text x="800" y="118" text-anchor="middle" class="t">TEST — 15%</text>
  <text x="800" y="138" text-anchor="middle" class="s">scored exactly once,</text>
  <text x="800" y="152" text-anchor="middle" class="s">after all tuning</text>

  <text x="890" y="112" text-anchor="middle" class="t" font-size="12">LIVE</text>
  <text x="890" y="130" text-anchor="middle" class="s">serving</text>
  <text x="890" y="144" text-anchor="middle" class="s">region</text>

  <!-- time axis -->
  <line x1="60" y1="185" x2="930" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="60"  y="205" class="s">~2010</text>
  <text x="900" y="205" text-anchor="end" class="s">today →</text>

  <!-- annotations -->
  <line x1="620" y1="90" x2="620" y2="75" stroke="#475569"/>
  <line x1="740" y1="90" x2="740" y2="75" stroke="#475569"/>
  <line x1="860" y1="90" x2="860" y2="75" stroke="#475569"/>
  <text x="620" y="68" text-anchor="middle" class="e">chronological boundary — never shuffled</text>

  <text x="60" y="245" class="t" font-size="13">Leakage guards active across the whole timeline:</text>
  <text x="60" y="268" class="s">• Splits use the event date (raw_headlines.date), never ingestion time — a late backfill cannot move a headline across a boundary.</text>
  <text x="60" y="286" class="s">• Weekend/holiday news rolls forward to the next trading day; price features are .shift(&#8805;1) lagged; cross-assets are lagged log-returns.</text>
  <text x="60" y="304" class="s">• Target = (next close &gt; close) via the only shift(-1) in the package. The trailing unlabeled day is kept in serving mode as a</text>
  <text x="60" y="322" class="s">   Target = -1 sentinel (dashed LIVE region above): the model trains on real labels only and forward-predicts the sentinel day.</text>
</svg>
