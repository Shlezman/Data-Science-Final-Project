<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>
  <style>
    .t{font-size:15px;font-weight:bold;fill:#0f172a}
    .s{font-size:12px;fill:#475569}
  </style>

  <rect x="40"  y="40" width="540" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="580" y="40" width="120" height="80" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <rect x="700" y="40" width="120" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="820" y="40" width="70"  height="80" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="310" y="72" text-anchor="middle" class="t">TRAIN — 70%</text>
  <text x="310" y="96" text-anchor="middle" class="s">all transforms fit here only</text>

  <text x="640" y="72" text-anchor="middle" class="t">VALID — 15%</text>
  <text x="640" y="96" text-anchor="middle" class="s">all tuning</text>

  <text x="760" y="72" text-anchor="middle" class="t">TEST — 15%</text>
  <text x="760" y="96" text-anchor="middle" class="s">scored once</text>

  <text x="855" y="72" text-anchor="middle" class="t" font-size="13">LIVE</text>
  <text x="855" y="96" text-anchor="middle" class="s">Target = −1</text>

  <line x1="40" y1="150" x2="900" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40"  y="172" class="s">~2010</text>
  <text x="880" y="172" text-anchor="end" class="s">today</text>
</svg>
