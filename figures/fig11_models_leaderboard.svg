<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" font-family="Helvetica,Arial,sans-serif">
  <style>
    .title{font-size:15px;font-weight:bold;fill:#0f172a}
    .h{font-size:10.5px;font-weight:bold;fill:#475569;letter-spacing:.04em}
    .name{font-size:14px;font-weight:bold;fill:#0f172a}
    .sub{font-size:11px;fill:#94a3b8}
    .val{font-size:13px;fill:#14181f}
    .tr{font-size:12px;fill:#64748b}
    .chip{font-size:10px;fill:#475569}
  </style>

  <text x="20" y="20" class="title">Models</text>

  <!-- header -->
  <rect x="0" y="34" width="780" height="30" fill="#eef2f7"/>
  <text x="20"  y="53" class="h">MODEL</text>
  <text x="470" y="53" class="h">ROC-AUC</text>
  <text x="590" y="53" class="h">ACCURACY</text>
  <text x="690" y="53" class="h">TRAINED</text>
  <line x1="0" y1="64" x2="780" y2="64" stroke="#cbd3dd" stroke-width="1"/>

  <!-- row 1: PatchTST (active champion) -->
  <rect x="0" y="64" width="780" height="42" fill="#dcfce7"/>
  <text x="20" y="88" class="name">PatchTST</text>
  <rect x="150" y="76" width="70" height="17" rx="4" fill="#c7f0d6"/>
  <text x="158" y="88" class="chip">patchtst</text>
  <text x="20" y="101" class="sub">torch</text>
  <text x="470" y="91" class="val">0.5495</text>
  <text x="590" y="91" class="val">0.578</text>
  <text x="690" y="91" class="tr">2026-07-02</text>
  <line x1="0" y1="106" x2="780" y2="106" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 2: TCN -->
  <text x="20" y="130" class="name">TCN</text>
  <rect x="150" y="118" width="44" height="17" rx="4" fill="#e2e8f0"/>
  <text x="158" y="130" class="chip">tcn</text>
  <text x="20" y="143" class="sub">torch</text>
  <text x="470" y="133" class="val">0.5731</text>
  <text x="590" y="133" class="val">0.568</text>
  <text x="690" y="133" class="tr">2026-07-02</text>
  <line x1="0" y1="148" x2="780" y2="148" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 3: CatBoost -->
  <text x="20" y="172" class="name">CatBoost</text>
  <rect x="150" y="160" width="66" height="17" rx="4" fill="#e2e8f0"/>
  <text x="158" y="172" class="chip">catboost</text>
  <text x="20" y="185" class="sub">joblib</text>
  <text x="470" y="175" class="val">0.5682</text>
  <text x="590" y="175" class="val">0.563</text>
  <text x="690" y="175" class="tr">2026-07-02</text>
  <line x1="0" y1="190" x2="780" y2="190" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 4: Ensemble -->
  <text x="20" y="214" class="name">Ensemble</text>
  <rect x="150" y="202" width="66" height="17" rx="4" fill="#e2e8f0"/>
  <text x="158" y="214" class="chip">ensemble</text>
  <text x="20" y="227" class="sub">soft-vote top-3</text>
  <text x="470" y="217" class="val">0.5513</text>
  <text x="590" y="217" class="val">0.512</text>
  <text x="690" y="217" class="tr">2026-07-02</text>
  <line x1="0" y1="232" x2="780" y2="232" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 5: XGBoost -->
  <text x="20" y="256" class="name">XGBoost</text>
  <rect x="150" y="244" width="62" height="17" rx="4" fill="#e2e8f0"/>
  <text x="158" y="256" class="chip">xgboost</text>
  <text x="20" y="269" class="sub">joblib</text>
  <text x="470" y="259" class="val">0.5476</text>
  <text x="590" y="259" class="val">0.553</text>
  <text x="690" y="259" class="tr">2026-07-02</text>
  <line x1="0" y1="274" x2="780" y2="274" stroke="#cbd3dd" stroke-width="1"/>
</svg>
