<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>
  <style>
    .host{fill:#f8fafc;stroke:#334155;stroke-width:2}
    .inner{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2}
    .db{fill:#eef2ff;stroke:#4338ca;stroke-width:2}
    .t{font-size:15px;font-weight:bold;fill:#0f172a}
    .h{font-size:16px;font-weight:bold;fill:#1e293b}
    .s{font-size:11.5px;fill:#475569}
    .e{font-size:11px;fill:#4338ca}
    .arrow{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
  </style>
  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Two-host deployment — all cross-host traffic is database-mediated</text>

  <!-- GPU node -->
  <rect x="30" y="55" width="400" height="420" class="host" rx="12"/>
  <text x="230" y="82" text-anchor="middle" class="h">GPU compute node (RTX 4090)</text>
  <rect x="55" y="100" width="350" height="120" class="inner" rx="8"/>
  <text x="230" y="122" text-anchor="middle" class="t">Nightly cron — scripts/daily_live.py</text>
  <text x="230" y="142" text-anchor="middle" class="s">scrape → score → embed → derive → predict → settle</text>
  <text x="230" y="158" text-anchor="middle" class="s">lock file · per-stage logs · status JSON</text>
  <text x="230" y="174" text-anchor="middle" class="s">skips non-trading days + holidays</text>
  <text x="230" y="196" text-anchor="middle" class="e">17:00 nightly narrative simulation (sim_daily.py)</text>
  <rect x="55" y="240" width="350" height="70" class="inner" rx="8"/>
  <text x="230" y="263" text-anchor="middle" class="t">Local LLM — Ollama (gemma4)</text>
  <text x="230" y="281" text-anchor="middle" class="s">live-era scoring: one headline per structured call</text>
  <text x="230" y="297" text-anchor="middle" class="s">persona-simulation statements + reports</text>
  <rect x="55" y="330" width="350" height="60" class="inner" rx="8"/>
  <text x="230" y="352" text-anchor="middle" class="t">Registry training (periodic)</text>
  <text x="230" y="370" text-anchor="middle" class="s">train_registry.py — full zoo + Optuna, not nightly</text>
  <rect x="55" y="405" width="350" height="50" class="inner" rx="8"/>
  <text x="230" y="425" text-anchor="middle" class="t">Embeddings — multilingual-e5 (CUDA)</text>
  <text x="230" y="442" text-anchor="middle" class="s">new headlines only, cached in the DB</text>

  <!-- DB/UI host -->
  <rect x="550" y="55" width="400" height="420" class="host" rx="12"/>
  <text x="750" y="82" text-anchor="middle" class="h">Database / UI host</text>
  <rect x="575" y="100" width="350" height="95" class="db" rx="8"/>
  <text x="750" y="124" text-anchor="middle" class="t">PostgreSQL 16 (:5432)</text>
  <text x="750" y="143" text-anchor="middle" class="s">headlines · scores · embeddings · features</text>
  <text x="750" y="159" text-anchor="middle" class="s">model registry · predictions · simulations</text>
  <text x="750" y="180" text-anchor="middle" class="e">the only cross-host interface</text>
  <rect x="575" y="215" width="350" height="105" class="inner" rx="8"/>
  <text x="750" y="238" text-anchor="middle" class="t">Dashboard — FastAPI + React SPA (:3000)</text>
  <text x="750" y="256" text-anchor="middle" class="s">read-only JSON API, in-process caching</text>
  <text x="750" y="272" text-anchor="middle" class="s">process supervisor (pm2) · password login gate</text>
  <text x="750" y="288" text-anchor="middle" class="s">nginx TLS reverse proxy :443 (wildcard cert)</text>
  <text x="750" y="308" text-anchor="middle" class="e">sentisens.cs.colman.ac.il → 127.0.0.1:3000</text>
  <rect x="575" y="340" width="350" height="60" class="inner" rx="8"/>
  <text x="750" y="362" text-anchor="middle" class="t">MongoDB (:21771)</text>
  <text x="750" y="380" text-anchor="middle" class="s">performance-panel versions · simulation archive</text>
  <rect x="575" y="415" width="350" height="45" class="inner" rx="8"/>
  <text x="750" y="433" text-anchor="middle" class="t">Nightly Mongo archive cron</text>
  <text x="750" y="449" text-anchor="middle" class="s">archive_sims_to_mongo.py — versioned history</text>

  <!-- arrows -->
  <path class="arrow" d="M430 160 C500 150 510 140 548 135"/>
  <text x="452" y="132" class="e">writes</text>
  <path class="arrow" d="M548 165 C505 175 480 185 432 190"/>
  <text x="470" y="205" class="e">reads features</text>
  <path class="arrow" d="M750 215 L750 197"/>
  <text x="760" y="210" class="e">reads</text>
</svg>
